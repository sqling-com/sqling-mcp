name: release

# Pushing a tag v<version> builds the package and publishes it to PyPI.
# PyPI trusts this workflow, in the "pypi" environment, by name (trusted
# publishing): there is no token or password anywhere.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      # The tag and the package must agree, or PyPI gets a version nobody tagged.
      - run: |
          want="${GITHUB_REF_NAME#v}"
          ls dist/ | grep -q -- "-${want}-py3-none-any.whl" \
            || { echo "tag $GITHUB_REF_NAME does not match the built version:"; ls dist/; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
